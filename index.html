<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Videos Educativos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <style>
        body { background-color: #1A2330; color: #e2e8f0; }
        .navbar, .modal-content, .card { background-color: #263041; color: #e2e8f0; border: none; }
        .form-control, .form-select { background-color: #1A2330; color: #fff; border: 1px solid #475569; }
        .form-control:focus, .form-select:focus { background-color: #1A2330; color: #fff; box-shadow: none; border-color: #3b82f6; }
        .card-title { font-weight: bold; }
        .video-thumbnail { height: 180px; object-fit: cover; }
        .comment-box { background-color: #1A2330; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
        .reply-box { margin-left: 20px; border-left: 2px solid #475569; padding-left: 10px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">EduStream</a>
        <div id="authContainer" class="d-flex align-items-center gap-3">
            <!-- Botones dinámicos de Login/Registro o Usuario -->
        </div>
    </div>
</nav>

<div class="container mb-4">
    <div class="row g-3">
        <div class="col-md-8">
            <input type="text" id="searchInput" class="form-control" placeholder="Buscar video por título...">
        </div>
        <div class="col-md-4">
            <select id="categoryFilter" class="form-select">
                <option value="ALL">Todas las Categorías</option>
            </select>
        </div>
    </div>
</div>

<div class="container">
    <div class="row g-4" id="videoGrid">
        <!-- Tarjetas de video generadas con JS -->
    </div>
</div>

<!-- Modal Reproductor -->
<div class="modal fade" id="videoModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="videoTitle">Título</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <video id="videoPlayer" controls class="w-100 rounded mb-3" style="background: #000; max-height: 400px;">
                    <source src="" type="video/mp4">
                </video>
                
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="badge bg-primary" id="videoCategory"></span>
                    <button id="btnLike" class="btn btn-outline-danger btn-sm" disabled onclick="toggleLike()">
                        <i class="bi bi-heart-fill"></i> Me Gusta (<span id="likeCount">0</span>)
                    </button>
                </div>
                <p id="videoDescription" class="small text-light"></p>
                
                <hr class="border-secondary">
                <h6>Comentarios</h6>
                
                <div id="commentFormArea" class="mb-3">
                    <!-- Formulario inyectado si el usuario está logueado -->
                </div>
                
                <div id="commentsList">
                    <!-- Lista de comentarios generada con JS -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Login -->
<div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Iniciar Sesión</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formLogin">
                    <div class="mb-3">
                        <label>Carné o Correo</label>
                        <input type="text" id="loginUsuario" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Contraseña (PIN)</label>
                        <input type="password" id="loginPin" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal Registro -->
<div class="modal fade" id="registroModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Registro de Estudiante</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formRegistro">
                    <div class="mb-3">
                        <label>Carné (Ej: 1890-20-11489)</label>
                        <input type="text" id="regCarne" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Nombre Completo</label>
                        <input type="text" id="regNombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Correo Electrónico</label>
                        <input type="email" id="regCorreo" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>PIN (Solo números)</label>
                        <input type="password" id="regPin" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Registrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
